name: enterprise-news-lakehouse

x-celery-env: &celery-env
  CELERY_BROKER_URL: amqp://${RABBITMQ_USER:-celery_news}:${RABBITMQ_PASSWORD:?Defina RABBITMQ_PASSWORD no .env}@rabbitmq:5672/news_lakehouse
  CELERY_RESULT_BACKEND: rpc://
  PYTHONUNBUFFERED: "1"
  PYTHONPATH: /app
  TZ: America/Sao_Paulo
  PROMETHEUS_MULTIPROC_DIR: /tmp/prometheus

x-celery-build: &celery-build
  context: .
  dockerfile: scripts_dockerfile/celery.Dockerfile

x-celery-depends: &celery-depends
  rabbitmq:
    condition: service_healthy

services:
  rabbitmq:
    image: rabbitmq:4-management
    container_name: news_rabbitmq
    hostname: rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-celery_news}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?Defina RABBITMQ_PASSWORD no .env}
      RABBITMQ_DEFAULT_VHOST: news_lakehouse
      TZ: America/Sao_Paulo
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
    volumes:
      - ./rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      news-network:
        ipv4_address: 172.28.50.10

  storage:
    image: rustfs/rustfs:1.0.0-alpha.83
    container_name: storage
    profiles: [servico_ml]
    restart: unless-stopped
    environment:
      RUSTFS_ADDRESS: ":9000"
      RUSTFS_REGION: ${AWS_DEFAULT_REGION:-us-east-1}
      RUSTFS_ACCESS_KEY: ${AWS_ACCESS_KEY_ID:?Defina AWS_ACCESS_KEY_ID no .env}
      RUSTFS_SECRET_KEY: ${AWS_SECRET_ACCESS_KEY:?Defina AWS_SECRET_ACCESS_KEY no .env}
      RUSTFS_CONSOLE_ENABLE: ${RUSTFS_CONSOLE_ENABLE:-true}
      TZ: America/Sao_Paulo
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - ./storage-data:/data
    networks:
      news-network:
        ipv4_address: 172.28.50.28

  app:
    build:
      context: .
      dockerfile: scripts_dockerfile/app_prometheus.Dockerfile
    container_name: rss_app
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
    environment: *celery-env
    volumes:
      - ./prometheus_multiproc:/tmp/prometheus
    depends_on: *celery-depends
    networks:
      news-network:
        ipv4_address: 172.28.50.20

  worker_celery_beat:
    build: *celery-build
    container_name: worker_celery_beat
    restart: unless-stopped
    working_dir: /app
    environment: *celery-env
    volumes:
      - ./app:/app
      - ./prometheus_multiproc:/tmp/prometheus
      - ./celerybeat_data:/app/celerybeat
    depends_on: *celery-depends
    command: >-
      celery -A celery_app:celery_app beat
      --loglevel=INFO
      --pidfile=
      --schedule=/app/celerybeat/celerybeat-schedule.db
      --max-interval=5
    networks:
      news-network:
        ipv4_address: 172.28.50.21

  worker_rss_ingestion:
    build: *celery-build
    container_name: worker_rss_ingestion
    restart: unless-stopped
    environment: *celery-env
    volumes:
      - ./app:/app
      - ./prometheus_multiproc:/tmp/prometheus
    depends_on: *celery-depends
    command: celery -A celery_app:celery_app worker -Q rss_ingestion --concurrency=4 --loglevel=INFO
    networks:
      news-network:
        ipv4_address: 172.28.50.22

  worker_rss_processar_noticia:
    build: *celery-build
    container_name: worker_rss_processar_noticia
    restart: unless-stopped
    environment: *celery-env
    volumes:
      - ./app:/app
      - ./prometheus_multiproc:/tmp/prometheus
    depends_on: *celery-depends
    command: celery -A celery_app:celery_app worker -Q processar_noticia --concurrency=4 --loglevel=INFO
    networks:
      news-network:
        ipv4_address: 172.28.50.23

  worker_monitoramento:
    build: *celery-build
    container_name: worker_monitoramento
    restart: unless-stopped
    environment: *celery-env
    volumes:
      - ./app:/app
      - ./prometheus_multiproc:/tmp/prometheus
    depends_on: *celery-depends
    command: celery -A celery_app:celery_app worker -Q fila_monitoramento --concurrency=2 --loglevel=INFO
    networks:
      news-network:
        ipv4_address: 172.28.50.24

  flower:
    image: mher/flower:latest
    container_name: flower
    restart: unless-stopped
    environment:
      CELERY_BROKER_URL: amqp://${RABBITMQ_USER:-celery_news}:${RABBITMQ_PASSWORD:?Defina RABBITMQ_PASSWORD no .env}@rabbitmq:5672/news_lakehouse
      CELERY_RESULT_BACKEND: rpc://
      FLOWER_TIMEZONE: America/Sao_Paulo
      TZ: America/Sao_Paulo
    command: ["celery", "flower", "--port=5555", "--persistent=True", "--db=/data/flower.db"]
    ports:
      - "127.0.0.1:5555:5555"
    volumes:
      - ./flower_data:/data
    depends_on: *celery-depends
    networks:
      news-network:
        ipv4_address: 172.28.50.25

  prometheus:
    image: prom/prometheus
    container_name: prometheus
    restart: unless-stopped
    environment:
      TZ: America/Sao_Paulo
    volumes:
      - ./vl_prometeus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus_data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
    ports:
      - "127.0.0.1:9090:9090"
    networks:
      news-network:
        ipv4_address: 172.28.50.26

  grafana:
    image: grafana/grafana
    container_name: grafana
    restart: unless-stopped
    volumes:
      - ./grafana_data:/var/lib/grafana
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Defina GRAFANA_ADMIN_PASSWORD no .env}
      TZ: America/Sao_Paulo
    networks:
      news-network:
        ipv4_address: 172.28.50.27

  trino:
    image: trinodb/trino:484
    container_name: trino
    restart: unless-stopped
    environment:
      TZ: America/Sao_Paulo
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./trino_catalog:/etc/trino/catalog:ro
      - ./trino_data:/data/trino
    networks:
      news-network:
        ipv4_address: 172.28.50.30

  spark-master:
    image: apache/spark:3.5.6
    container_name: spark-master
    hostname: spark-master
    restart: unless-stopped
    user: "0:0"
    environment:
      TZ: America/Sao_Paulo
      SPARK_MASTER_HOST: spark-master
    entrypoint: ["/opt/spark/bin/spark-class"]
    command: ["org.apache.spark.deploy.master.Master", "--host", "spark-master", "--port", "7077", "--webui-port", "8080"]
    ports:
      - "127.0.0.1:7077:7077"
      - "127.0.0.1:8082:8080"
    volumes:
      - ./spark_jobs:/opt/spark/jobs
      - ./spark_master_data:/opt/spark/work
    networks:
      news-network:
        ipv4_address: 172.28.50.31

  spark-worker:
    image: apache/spark:3.5.6
    container_name: spark-worker
    restart: unless-stopped
    user: "0:0"
    environment:
      TZ: America/Sao_Paulo
      SPARK_WORKER_CORES: ${SPARK_WORKER_CORES:-2}
      SPARK_WORKER_MEMORY: ${SPARK_WORKER_MEMORY:-2g}
      SPARK_WORKER_DIR: /opt/spark/work
    entrypoint: ["/opt/spark/bin/spark-class"]
    command: ["org.apache.spark.deploy.worker.Worker", "--webui-port", "8081", "spark://spark-master:7077"]
    ports:
      - "127.0.0.1:8083:8081"
    volumes:
      - ./spark_jobs:/opt/spark/jobs
      - ./spark_worker_data:/opt/spark/work
    depends_on:
      - spark-master
    networks:
      news-network:
        ipv4_address: 172.28.50.32

  pyspark:
    image: apache/spark:3.5.6
    profiles: [spark-tools]
    user: "0:0"
    environment:
      TZ: America/Sao_Paulo
      PYSPARK_PYTHON: python3
    entrypoint: ["/opt/spark/bin/spark-submit"]
    command: ["--version"]
    volumes:
      - ./spark_jobs:/opt/spark/jobs
      - ./spark_client_data:/opt/spark/work
    depends_on:
      - spark-master
    networks:
      news-network:
        ipv4_address: 172.28.50.33

  enl_rabbitmq:
    image: rabbitmq:4-management
    container_name: enl_rabbitmq
    hostname: enl-rabbitmq
    profiles: [enl_fundacao]
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${ENL_RABBITMQ_USER:-enl_usuario}
      RABBITMQ_DEFAULT_PASS: ${ENL_RABBITMQ_PASSWORD:-enl_senha_dev}
      RABBITMQ_DEFAULT_VHOST: ${ENL_RABBITMQ_VHOST:-enl_vhost}
      TZ: America/Sao_Paulo
    ports:
      - "127.0.0.1:${ENL_RABBITMQ_PORT:-5673}:5672"
      - "127.0.0.1:${ENL_RABBITMQ_MGMT_PORT:-15673}:15672"
    volumes:
      - ./volumes/enl_rabbitmq:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      news-network:
        ipv4_address: 172.28.50.40

  enl_postgres:
    image: postgres:16-alpine
    container_name: enl_postgres
    hostname: enl-postgres
    profiles: [enl_fundacao]
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${ENL_POSTGRES_USER:-enl_postgres}
      POSTGRES_PASSWORD: ${ENL_POSTGRES_PASSWORD:-enl_postgres_dev}
      POSTGRES_DB: ${ENL_POSTGRES_DB:-enl_operacional}
      TZ: America/Sao_Paulo
    ports:
      - "127.0.0.1:${ENL_POSTGRES_PORT:-5433}:5432"
    volumes:
      - ./volumes/enl_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${ENL_POSTGRES_USER:-enl_postgres} -d ${ENL_POSTGRES_DB:-enl_operacional}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      news-network:
        ipv4_address: 172.28.50.41

  enl_storage:
    image: rustfs/rustfs:1.0.0-alpha.83
    container_name: enl_storage
    hostname: enl-storage
    profiles: [enl_fundacao]
    restart: unless-stopped
    environment:
      RUSTFS_ADDRESS: ":9000"
      RUSTFS_REGION: ${ENL_STORAGE_REGION:-us-east-1}
      RUSTFS_ACCESS_KEY: ${ENL_STORAGE_ACCESS_KEY:-enl_storage_admin}
      RUSTFS_SECRET_KEY: ${ENL_STORAGE_SECRET_KEY:-enl_storage_secret}
      RUSTFS_CONSOLE_ENABLE: ${RUSTFS_CONSOLE_ENABLE:-true}
      TZ: America/Sao_Paulo
    ports:
      - "127.0.0.1:${ENL_STORAGE_PORT:-9010}:9000"
      - "127.0.0.1:${ENL_STORAGE_CONSOLE_PORT:-9011}:9001"
    volumes:
      - ./volumes/enl_storage:/data
    healthcheck:
      test: ["CMD-SHELL", "echo > /dev/tcp/127.0.0.1/9000 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      news-network:
        ipv4_address: 172.28.50.42

  enl_celery_worker_rss:
    build: *celery-build
    container_name: enl_celery_worker_rss
    hostname: enl-celery-worker-rss
    profiles: [enl_ingestao]
    restart: unless-stopped
    environment:
      CELERY_BROKER_URL: amqp://${ENL_RABBITMQ_USER:-enl_usuario}:${ENL_RABBITMQ_PASSWORD:-enl_senha_dev}@enl_rabbitmq:5672/${ENL_RABBITMQ_VHOST:-enl_vhost}
      CELERY_RESULT_BACKEND: rpc://
      PYTHONUNBUFFERED: "1"
      PYTHONPATH: /app/src
      TZ: America/Sao_Paulo
      PROMETHEUS_MULTIPROC_DIR: /tmp/prometheus
    volumes:
      - ./volumes/enl_prometheus_multiproc:/tmp/prometheus
    depends_on:
      enl_rabbitmq:
        condition: service_healthy
      enl_postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python3 -c 'import enterprise_news' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    networks:
      news-network:
        ipv4_address: 172.28.50.43

  enl_celery_beat:
    build: *celery-build
    container_name: enl_celery_beat
    hostname: enl-celery-beat
    profiles: [enl_ingestao]
    restart: unless-stopped
    environment:
      CELERY_BROKER_URL: amqp://${ENL_RABBITMQ_USER:-enl_usuario}:${ENL_RABBITMQ_PASSWORD:-enl_senha_dev}@enl_rabbitmq:5672/${ENL_RABBITMQ_VHOST:-enl_vhost}
      CELERY_RESULT_BACKEND: rpc://
      PYTHONUNBUFFERED: "1"
      PYTHONPATH: /app/src
      TZ: America/Sao_Paulo
      PROMETHEUS_MULTIPROC_DIR: /tmp/prometheus
    volumes:
      - ./volumes/enl_celerybeat:/app/celerybeat
      - ./volumes/enl_prometheus_multiproc:/tmp/prometheus
    depends_on:
      enl_rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "test -d /app/celerybeat || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    networks:
      news-network:
        ipv4_address: 172.28.50.44

networks:
  news-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.50.0/24